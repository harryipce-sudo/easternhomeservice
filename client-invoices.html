<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Invoices | Eastern Home Service</title>
  <link rel="stylesheet" href="./client-invoices.css">
</head>
<body>
  <main class="portal-shell">
    <header class="portal-header">
      <img src="./assets/eastern-home-service-logo-clean.png" alt="Eastern Home Services" class="brand-logo">
      <p>Invoice portal</p>
    </header>
    <section class="portal-intro">
      <h1>Your unpaid invoices</h1>
      <p id="portal-copy">Loading your invoice information…</p>
    </section>
    <section id="invoice-totals" class="invoice-totals" aria-label="Invoice totals"></section>
    <p class="referral-note">Referral fees are payable only after the related invoice has been marked paid.</p>
    <section class="invoice-table-frame" aria-label="Unpaid invoices">
      <div id="invoice-list" class="invoice-list" aria-live="polite"></div>
    </section>
    <section id="paid-referral-section" class="paid-referral-section" hidden aria-label="Referral fees for paid invoices">
      <div class="paid-referral-heading"><div><h2>Referral fees for paid invoices</h2><p id="paid-referral-copy"></p></div></div>
      <div class="invoice-table-frame"><div id="paid-referral-list" class="invoice-list"></div></div>
    </section>
    <p class="portal-help">For payment or invoice questions, please contact Eastern Home Service.</p>
  </main>
  <script src="./client-invoices.js"></script>
</body>
</html>
